name: gpcract
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip>=23
  # Core scientific stack
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.11
  - scikit-learn>=1.4
  - tqdm>=4.66
  - requests>=2.28
  - pyyaml>=6.0
  # Bio/Chem
  - biopython>=1.79
  - rdkit>=2024.03
  # Plotting / notebooks (analysis + reproducibility)
  - matplotlib>=3.6
  - seaborn>=0.12
  - jupyterlab>=4.0
  - ipykernel>=6.0
  # Install GPU/graph-DL stack via pip for correct PyTorch-Geometric wheels
  - pip:
      - -r requirements.txt
